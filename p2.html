<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>指示</title>
<style>
:root{--bg:#fafaf7;--fg:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--fg:#eee}}
:root[data-theme="dark"]{--bg:#1b1b1a;--fg:#eee}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
main{padding:24px;max-width:640px}
.title{font-size:2.4rem;line-height:1.4;font-weight:bold;margin-bottom:16px}
.main{font-size:1.6rem;line-height:1.7;font-weight:bold;text-wrap:balance}
</style>
</head>
<body>
<main>
<div class="title">最終課題</div>
<div class="main">空白の部屋で赤シートを全員でかかげろ</div>
</main>
</body>
</html>
